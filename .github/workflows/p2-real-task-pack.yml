name: P2 docmancer7 real-task gold controls

on:
  pull_request:
    branches: [main]
    paths:
      - '.product-truth/**'
      - '.github/workflows/p2-real-task-pack.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gold-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run two clean gold controls for all eight tasks
        id: gold
        shell: bash
        run: |
          set +e
          python .product-truth/real_task_pack.py \
            --manifest .product-truth/real-task-pack.json \
            --output _artifacts/docmancer7-real-task-gold.json
          status=$?
          set -e
          git diff --check
          exit "$status"

      - name: Upload bounded gold-control evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docmancer7-real-task-gold
          path: _artifacts/docmancer7-real-task-gold.json
          if-no-files-found: error
          retention-days: 7
